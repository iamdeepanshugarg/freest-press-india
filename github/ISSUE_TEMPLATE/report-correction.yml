name: Report correction
description: Report wrong, outdated, or biased information in the directory
title: "Correction: "
labels: ["correction", "needs-verification"]
body:
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or outdated?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence/source links
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - Low
        - Medium
        - High - could mislead readers
